# QLoRA Fine-Tuning Configuration
# =================================

# PEFT Technique
technique: "qlora"

# Base Model
model_name: "meta-llama/Llama-2-13b-hf"  # Can handle larger models!

# QLoRA Configuration (extends LoRA)
peft_config:
  # LoRA parameters
  r: 16
  lora_alpha: 32
  target_modules:
    - "q_proj"
    - "v_proj"
    - "k_proj"
    - "o_proj"
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  
  # Quantization parameters
  load_in_4bit: true                      # 4-bit quantization
  bnb_4bit_compute_dtype: "float16"       # Compute dtype (float16/bfloat16)
  bnb_4bit_quant_type: "nf4"              # Quantization type (nf4/fp4)
  bnb_4bit_use_double_quant: true         # Double quantization

# Training Configuration
epochs: 3
batch_size: 2                             # Smaller batch for large models
grad_accum: 8                             # More accumulation
learning_rate: 0.0002
max_length: 1024                          # Longer sequences possible
warmup_steps: 100
weight_decay: 0.01

# Data
train_data: "data/raw/train.json"
eval_data: "data/raw/eval.json"

# Output
output_dir: "outputs/qlora_experiment"
save_steps: 500
eval_steps: 500
logging_steps: 10

# Hardware
fp16: true
gradient_checkpointing: true              # Essential for large models

# Notes
# -----
# QLoRA enables fine-tuning 65B models on single 48GB GPU
# - 13B model: ~9GB VRAM
# - 33B model: ~19GB VRAM  
# - 65B model: ~35GB VRAM
